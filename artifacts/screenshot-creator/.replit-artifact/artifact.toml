kind = "web"
previewPath = "/"
title = "Phone Screenshot Creator"
version = "1.0.0"
id = "artifacts/screenshot-creator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19642

[services.development]
run = "pnpm --filter @workspace/screenshot-creator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/screenshot-creator", "run", "build" ]
publicDir = "artifacts/screenshot-creator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19642"
BASE_PATH = "/"
